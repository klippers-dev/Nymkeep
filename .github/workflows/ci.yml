name: CI

on:
  push:
    branches: [dev, stage, main]
  pull_request:
    branches: [dev, stage, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and source audit
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=1
      - run: npm run test:tooling
      - run: npm run build
      - run: npm run audit:source
  native:
    name: Rust (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Cache Intel runtime build
        id: intel-runtime-cache
        if: matrix.target == 'x86_64-apple-darwin'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .release-work/onnxruntime-intel
          key: macos-15-intel-onnx-1.28.0-${{ hashFiles('scripts/build-intel-onnx.mjs', 'scripts/release/intel-onnx-libs.mjs') }}
          # Migration cache: same pinned CPU sources; the builder reconfigures its recipe.
          restore-keys: macos-15-intel-onnx-1.28.0-11832efa32e5fc4c2c8452e5231fbdcd8f0ba9bb7d59791f54fde962d39ca409
      - name: Build pinned Intel runtime
        if: matrix.target == 'x86_64-apple-darwin'
        run: node scripts/build-intel-onnx.mjs
      - name: Save completed Intel runtime
        if: matrix.target == 'x86_64-apple-darwin' && steps.intel-runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .release-work/onnxruntime-intel
          key: ${{ steps.intel-runtime-cache.outputs.cache-primary-key }}
      - name: Verify NER resources
        shell: pwsh
        run: ./scripts/download-model.ps1
      - name: Prepare official Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/windows-runtime.ps1
      - name: Verify Linux OCR resources
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/download-ocr-models.ps1
      - name: Build Mac Vision helper
        if: runner.os == 'macOS'
        run: node scripts/build-macos-ocr.mjs ${{ matrix.target }}
      - name: Build frontend
        run: |
          npm ci
          npm run build
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo test --locked -j 2 --target ${{ matrix.target }}
      - name: Mac native OCR fixture
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo test --locked -j 2 --target ${{ matrix.target }} --test screenshot_workflow -- --ignored --test-threads=1
      - name: Linux native OCR and selection fixtures
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb openbox dbus-x11 python3-gi gir1.2-gtk-3.0
          cargo test --manifest-path src-tauri/Cargo.toml --locked -j 2 --target ${{ matrix.target }} --test screenshot_workflow -- --ignored --test-threads=1
          bash scripts/verify-linux-capture.sh ${{ matrix.target }}
  required:
    name: Required checks
    if: always()
    needs: [frontend, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$FRONTEND_RESULT" = success
          test "$NATIVE_RESULT" = success
