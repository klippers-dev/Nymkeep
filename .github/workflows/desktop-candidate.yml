name: Desktop candidates

# Internal unsigned artifacts only. Device certification is a separate gate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Stage clean sources
        run: node scripts/release/prepare.mjs .release-work/candidate
      - name: Cache Intel runtime build
        if: matrix.target == 'x86_64-apple-darwin'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .release-work/onnxruntime-intel
          key: macos-15-intel-onnx-1.28.0-${{ hashFiles('scripts/build-intel-onnx.mjs') }}
      - name: Build pinned Intel runtime
        if: matrix.target == 'x86_64-apple-darwin'
        run: node scripts/build-intel-onnx.mjs
      - name: Prepare official Windows runtime
        if: runner.os == 'Windows'
        working-directory: .release-work/candidate
        shell: pwsh
        run: ./scripts/release/windows-runtime.ps1
      - name: Verify NER model
        working-directory: .release-work/candidate
        shell: pwsh
        run: ./scripts/download-model.ps1
      - name: Verify Linux OCR models
        if: runner.os == 'Linux'
        working-directory: .release-work/candidate
        shell: pwsh
        run: ./scripts/download-ocr-models.ps1
      - name: Build native Vision helper
        if: runner.os == 'macOS'
        working-directory: .release-work/candidate
        run: node scripts/build-macos-ocr.mjs ${{ matrix.target }}
      - name: Frontend and staging tests
        working-directory: .release-work/candidate
        run: |
          npm ci
          npm test -- --maxWorkers=1
          node --test scripts/release/*.test.mjs
          npm run build
      - name: Rust checks
        working-directory: .release-work/candidate/src-tauri
        run: |
          cargo fmt --check
          cargo test --locked -j 2 --target ${{ matrix.target }}
      - name: Build unsigned candidate
        working-directory: .release-work/candidate
        run: npm run tauri -- build --target ${{ matrix.target }} --config src-tauri/tauri.candidate.conf.json -- --locked -j 2
      - name: Native Mac OCR fixture
        if: runner.os == 'macOS'
        working-directory: .release-work/candidate/src-tauri
        run: cargo test --locked -j 2 --target ${{ matrix.target }} --test screenshot_workflow -- --ignored --test-threads=1
      - name: Verify and collect packages
        working-directory: .release-work/candidate
        run: node scripts/release/collect.mjs src-tauri/target/${{ matrix.target }}/release/bundle artifacts/${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nymkeep-candidate-${{ matrix.target }}
          path: .release-work/candidate/artifacts/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 14
